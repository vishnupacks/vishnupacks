<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Products | Vishnu Packs</title>

<meta name="description"
content="Vishnu Packs - Our packaging products designed to pack, protect and deliver.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fff;
    color:#07563d;
    overflow-x:hidden;
}

.products-page{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:#fffdf8;
    padding:90px 5% 0;
}

/* TOP CURVE */
.products-page::before{
    content:"";
    position:absolute;
    top:-180px;
    right:-180px;
    width:760px;
    height:360px;
    background:#07563d;
    border-radius:0 0 0 100%;
    transform:rotate(12deg);
    z-index:0;
}

.products-page::after{
    content:"";
    position:absolute;
    top:-150px;
    right:-160px;
    width:720px;
    height:330px;
    border-bottom:10px solid #eda900;
    border-radius:0 0 0 100%;
    transform:rotate(12deg);
    z-index:1;
    pointer-events:none;
}

.container{
    position:relative;
    z-index:5;
    max-width:1400px;
    margin:auto;
}

/* HEADER */
.products-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
    margin-bottom:28px;
}

.logo{
    display:block;
    width:230px;
}

.logo img{
    width:100%;
    height:auto;
    display:block;
}

.top-right{
    display:flex;
    align-items:center;
    gap:26px;
    color:#07563d;
    font-size:15px;
    font-weight:700;
    letter-spacing:4px;
}

.top-right .line{
    width:120px;
    height:3px;
    background:#07563d;
}

/* TITLE */
.title-row{
    display:flex;
    align-items:center;
    gap:25px;
    margin:45px 0 22px;
}

.title-row h1{
    font-size:58px;
    line-height:1;
    font-weight:300;
    color:#07563d;
    letter-spacing:-1px;
}

.title-row h1 strong{
    font-weight:900;
}

.title-line{
    width:170px;
    height:4px;
    background:#07563d;
}

/* PRODUCT GRID */
.product-grid{
    display:grid;
    grid-template-columns:1fr 1.8fr 1fr;
    grid-template-rows:390px 350px;
    gap:10px;
}

.product-card{
    position:relative;
    overflow:hidden;
    border:3px solid #43b447;
    border-radius:18px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
}

.product-card img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    padding:8px;
}

.product-card:nth-child(1){
    grid-column:1;
    grid-row:1;
}

.product-card:nth-child(2){
    grid-column:2;
    grid-row:1;
}

.product-card:nth-child(3){
    grid-column:3;
    grid-row:1;
}

.product-card:nth-child(4){
    grid-column:1;
    grid-row:2;
}

.product-card:nth-child(5){
    grid-column:2;
    grid-row:2;
}

.product-card:nth-child(6){
    grid-column:3;
    grid-row:2;
}

.product-card:nth-child(7){
    grid-column:2;
    grid-row:2;
}

/* Bottom four cards layout */
.product-card:nth-child(4){
    grid-column:1;
}

.product-card:nth-child(5){
    grid-column:2;
}

.product-card:nth-child(6){
    grid-column:3;
}

.product-card:nth-child(7){
    grid-column:3;
    transform:translateY(0);
}

/* Use a dedicated bottom grid for the last four */
.product-grid{
    grid-template-columns:1fr 1fr 1fr 1fr;
    grid-template-rows:390px 350px;
}

.product-card:nth-child(1){
    grid-column:1;
    grid-row:1;
}

.product-card:nth-child(2){
    grid-column:2 / span 2;
    grid-row:1;
}

.product-card:nth-child(3){
    grid-column:4;
    grid-row:1;
}

.product-card:nth-child(4){
    grid-column:1;
    grid-row:2;
}

.product-card:nth-child(5){
    grid-column:2;
    grid-row:2;
}

.product-card:nth-child(6){
    grid-column:3;
    grid-row:2;
}

.product-card:nth-child(7){
    grid-column:4;
    grid-row:2;
}

/* BOTTOM BRAND SECTION */
.brand-section{
    position:relative;
    margin-top:18px;
    min-height:225px;
    overflow:hidden;
    background:#07563d;
    border-radius:0 110px 0 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:35px 55px;
}

.brand-section::after{
    content:"";
    position:absolute;
    left:0;
    bottom:24px;
    width:62%;
    height:5px;
    background:#83d900;
    transform:skewX(-18deg);
}

.brand-left{
    position:relative;
    z-index:2;
    color:white;
}

.brand-left .small{
    font-size:25px;
    font-weight:300;
    letter-spacing:1px;
}

.brand-left .big{
    margin-top:4px;
    font-size:35px;
    font-weight:900;
}

.brand-right{
    position:relative;
    z-index:2;
    background:#fffdf8;
    padding:30px 45px;
    border-radius:100px 0 0 100px;
    color:#07563d;
    font-size:34px;
    font-family:cursive;
    font-style:italic;
    font-weight:700;
    text-align:center;
}

/* FOOTER */
.footer{
    background:#fffdf8;
    border-top:3px solid #07563d;
    min-height:105px;
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr;
    align-items:center;
    gap:25px;
    padding:18px 40px;
    color:#07563d;
}

.footer-item{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:15px;
    font-weight:600;
    line-height:1.45;
}

.footer-icon{
    width:42px;
    height:42px;
    border-radius:10px;
    background:#07563d;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    flex-shrink:0;
}

.qr-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.qr-placeholder{
    width:65px;
    height:65px;
    border:4px solid #07563d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:900;
    text-align:center;
}

.scan-text{
    font-size:15px;
    font-weight:900;
}

/* RESPONSIVE */
@media(max-width:1000px){

    .products-page{
        padding:70px 25px 0;
    }

    .products-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .top-right{
        font-size:12px;
    }

    .title-row h1{
        font-size:48px;
    }

    .product-grid{
        grid-template-columns:1fr 1fr;
        grid-template-rows:auto;
    }

    .product-card:nth-child(n){
        grid-column:auto;
        grid-row:auto;
        height:330px;
        transform:none;
    }

    .brand-section{
        border-radius:0 70px 0 0;
        flex-direction:column;
        gap:25px;
        text-align:center;
    }

    .footer{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .products-page{
        padding:45px 14px 0;
    }

    .logo{
        width:190px;
    }

    .top-right{
        gap:10px;
        letter-spacing:2px;
        flex-wrap:wrap;
    }

    .top-right .line{
        width:60px;
    }

    .title-row{
        gap:12px;
        margin-top:30px;
    }

    .title-row h1{
        font-size:34px;
    }

    .title-line{
        width:60px;
        height:3px;
    }

    .product-grid{
        grid-template-columns:1fr;
    }

    .product-card:nth-child(n){
        height:310px;
    }

    .brand-section{
        padding:30px 20px;
    }

    .brand-left .small{
        font-size:19px;
    }

    .brand-left .big{
        font-size:27px;
    }

    .brand-right{
        font-size:25px;
        padding:22px 28px;
    }

    .footer{
        padding:18px 15px;
    }
}

</style>
</head>

</html>
