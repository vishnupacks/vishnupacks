<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vishnu Packs | Launching Soon</title>

    <meta name="description"
          content="Vishnu Packs - We care in every Pack. Our official website is launching soon.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #020302;
            color: white;
        }

        .page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background:
                radial-gradient(circle at center,
                rgba(0, 100, 45, 0.12),
                transparent 40%),
                #020302;
        }

        /* Moving green & gold lights */

        .light {
            position: absolute;
            width: 45vw;
            height: 100vh;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.8;
            pointer-events: none;
        }

        .light-left {
            left: -32vw;
            top: -10vh;
            border-right: 3px solid #dcae2b;
            box-shadow:
                15px 0 30px rgba(218, 174, 43, 0.35),
                35px 0 60px rgba(0, 180, 75, 0.25);
            animation: moveLeft 7s ease-in-out infinite alternate;
        }

        .light-right {
            right: -32vw;
            bottom: -10vh;
            border-left: 3px solid #dcae2b;
            box-shadow:
                -15px 0 30px rgba(218, 174, 43, 0.35),
                -35px 0 60px rgba(0, 180, 75, 0.25);
            animation: moveRight 8s ease-in-out infinite alternate;
        }

        @keyframes moveLeft {
            from {
                transform: translateY(-25px) rotate(-4deg);
            }
            to {
                transform: translateY(25px) rotate(4deg);
            }
        }

        @keyframes moveRight {
            from {
                transform: translateY(25px) rotate(4deg);
            }
            to {
                transform: translateY(-25px) rotate(-4deg);
            }
        }

        /* Particles */

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(255, 194, 50, 0.8) 1px, transparent 2px),
                radial-gradient(circle, rgba(0, 180, 75, 0.6) 1px, transparent 2px);
            background-size: 120px 120px, 170px 170px;
            animation: particlesMove 12s linear infinite;
            opacity: 0.35;
        }

        @keyframes particlesMove {
            from {
                background-position: 0 0, 0 0;
            }
            to {
                background-position: 120px 180px, -170px 100px;
            }
        }

        /* Main content */

        .content {
            position: relative;
            z-index: 5;
            width: min(1100px, 92%);
            padding: 30px 20px;
        }

        .logo {
            width: min(560px, 75vw);
            max-height: 330px;
            object-fit: contain;
            margin: 0 auto 25px;
            display: block;

            filter:
                drop-shadow(0 0 10px rgba(0, 180, 70, 0.35))
                drop-shadow(0 0 25px rgba(230, 180, 45, 0.25));

            animation: logoIn 1.5s ease-out,
                       logoGlow 4s ease-in-out infinite 1.5s;
        }

        @keyframes logoIn {
            from {
                opacity: 0;
                transform: translateY(-35px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes logoGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 0 10px rgba(0, 180, 70, 0.35))
                    drop-shadow(0 0 25px rgba(230, 180, 45, 0.25));
            }

            50% {
                filter:
                    drop-shadow(0 0 20px rgba(0, 220, 90, 0.55))
                    drop-shadow(0 0 40px rgba(230, 180, 45, 0.5));
            }
        }

        .small-title {
            letter-spacing: 9px;
            font-size: clamp(13px, 1.5vw, 20px);
            color: #eeeeee;
            margin-top: 10px;
            animation: fadeIn 1.5s ease-out 0.5s both;
        }

        .launch {
            margin-top: 12px;
            font-size: clamp(42px, 7vw, 92px);
            font-weight: 800;
            letter-spacing: 3px;
            line-height: 1;
            animation: launchIn 1.5s ease-out 0.8s both;
        }

        .launch .white {
            color: #ffffff;
        }

        .launch .gold {
            color: #e2ad29;
            text-shadow:
                0 0 10px rgba(226, 173, 41, 0.4),
                0 0 25px rgba(226, 173, 41, 0.25);
        }

        @keyframes launchIn {
            from {
                opacity: 0;
                transform: scale(0.9);
                letter-spacing: 15px;
            }

            to {
                opacity: 1;
                transform: scale(1);
                letter-spacing: 3px;
            }
        }

        .line {
            width: min(650px, 80%);
            height: 1px;
            margin: 25px auto 20px;
            background: linear-gradient(
                90deg,
                transparent,
                #dcae2b,
                transparent
            );
            position: relative;
            overflow: hidden;
        }

        .line::after {
            content: "";
            position: absolute;
            left: -30%;
            top: 0;
            width: 30%;
            height: 100%;
            background: white;
            box-shadow: 0 0 15px white;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to {
                left: 130%;
            }
        }

        .message {
            font-size: clamp(15px, 1.8vw, 21px);
            color: #cccccc;
            line-height: 1.7;
            animation: fadeIn 1.5s ease-out 1.2s both;
        }

        .message strong {
            color: #e3b438;
            font-weight: 500;
        }

        .social {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 14px;
            animation: fadeIn 1.5s ease-out 1.6s both;
        }

        .social span {
            width: 42px;
            height: 42px;
            border: 1px solid #dcae2b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2ad29;
            font-size: 14px;
            transition: 0.3s;
        }

        .social span:hover {
            background: #dcae2b;
            color: #050505;
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(220, 174, 43, 0.6);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            .content {
                padding: 20px 10px;
            }

            .logo {
                width: 88vw;
                margin-bottom: 18px;
            }

            .small-title {
                letter-spacing: 5px;
            }

            .launch {
                font-size: 42px;
                letter-spacing: 1px;
            }

            .message {
                font-size: 14px;
            }

            .social {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="light light-left"></div>
        <div class="light light-right"></div>
        <div class="particles"></div>

        <section class="content">

            <!-- Logo -->
            <img
                src="logo.png"
                alt="Vishnu Packs Logo"
                class="logo"
            >

            <div class="small-title">
                OUR WEBSITE IS
            </div>

            <h1 class="launch">
                <span class="white">LAUNCHING</span>
                <span class="gold"> SOON</span>
            </h1>

            <div class="line"></div>

            <p class="message">
                Something great is on the way!<br>
                We're crafting a better experience for you.
            </p>

            <div class="social">
                <span>f</span>
                <span>◎</span>
                <span>◉</span>
            </div>

        </section>

    </main>

</body>
</html>
