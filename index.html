<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vishnu Packs | Smart Packaging Solutions</title>

<meta name="description"
content="Vishnu Packs - Smart packaging solutions designed to pack, protect and deliver.">

<style>

/* ================================
   GLOBAL
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fff;
    color:#064f38;
    overflow-x:hidden;
}


/* ================================
   HOME
================================ */

.hero{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:#fffdf7;
}


/* BACKGROUND IMAGE
   50% OPACITY
================================ */

.hero::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:url("hero-bg.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    opacity:0.50;

    z-index:0;
}


/* SOFT WHITE OVERLAY
================================ */

.hero::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.20) 0%,
            rgba(255,255,255,0.04) 55%,
            rgba(255,255,255,0.10) 100%
        );

    z-index:1;
}


/* ================================
   HEADER
================================ */

.header{
    position:absolute;
    top:0;
    left:0;
    width:100%;

    height:150px;

    z-index:10;

    display:flex;
    align-items:center;
}


/* HEADER INNER */

.header-inner{
    width:100%;
    max-width:1450px;

    margin:auto;

    padding:0 55px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}


/* ================================
   LOGO
================================ */

.logo{
    width:390px;

    display:flex;
    align-items:center;

    position:relative;
    z-index:20;
}

.logo img{
    width:390px;
    height:auto;

    display:block;

    object-fit:contain;

    filter:
        drop-shadow(0 3px 3px rgba(0,0,0,0.08));
}


/* ================================
   NAVIGATION
================================ */

.nav{
    display:flex;
    align-items:center;
    gap:42px;
}

.nav a{
    text-decoration:none;

    font-size:15px;
    font-weight:700;

    color:#064f38;

    position:relative;

    transition:0.3s ease;
}

.nav a:hover{
    color:#86d400;
}

.nav a.active::after{
    content:"";

    position:absolute;

    left:0;
    bottom:-14px;

    width:100%;
    height:3px;

    background:#e8a900;

    border-radius:10px;
}


/* ================================
   QUOTE BUTTON
================================ */

.quote-btn{
    text-decoration:none;

    background:#e9a900;
    color:#063f2f;

    padding:18px 34px;

    border-radius:35px;

    font-size:14px;
    font-weight:800;

    letter-spacing:0.5px;

    box-shadow:
        0 8px 20px rgba(214,155,0,0.20);

    transition:0.3s ease;
}

.quote-btn:hover{
    transform:translateY(-3px);

    background:#f2b719;

    box-shadow:
        0 12px 25px rgba(214,155,0,0.30);
}


/* ================================
   HERO CONTENT
================================ */

.hero-content{
    position:relative;
    z-index:5;

    width:100%;
    max-width:1450px;

    min-height:100vh;

    margin:auto;

    padding:175px 55px 50px;

    display:grid;

    grid-template-columns:
        47%
        53%;

    align-items:center;
}


/* ================================
   HERO TEXT
================================ */

.hero-text{
    position:relative;
    z-index:6;

    padding-left:35px;

    margin-top:50px;
}

.small-title{
    display:none;
}


/* MAIN HEADING */

.hero-text h1{
    font-size:72px;

    line-height:0.98;

    font-weight:900;

    letter-spacing:-2.5px;

    color:#07563d;

    margin-bottom:28px;
}

.hero-text h1 span{
    display:block;

    color:#83d900;
}


/* DESCRIPTION */

.hero-description{
    max-width:600px;

    font-size:17px;

    line-height:1.7;

    color:#064f38;

    margin-bottom:35px;

    font-weight:500;
}


/* ================================
   BUTTONS
================================ */

.hero-buttons{
    display:flex;
    align-items:center;

    gap:20px;
}

.btn-primary{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:230px;

    padding:17px 30px;

    border-radius:35px;

    text-decoration:none;

    background:#eda900;

    color:#063f2f;

    font-size:15px;

    font-weight:800;

    box-shadow:
        0 8px 18px rgba(225,160,0,0.20);

    transition:0.3s ease;
}

.btn-primary:hover{
    transform:translateY(-3px);
}

.btn-secondary{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:185px;

    padding:16px 30px;

    border-radius:35px;

    text-decoration:none;

    background:rgba(255,255,255,0.65);

    color:#064f38;

    border:2px solid #07563d;

    font-size:15px;

    font-weight:800;

    transition:0.3s ease;
}

.btn-secondary:hover{
    background:#07563d;
    color:white;
}


/* ================================
   HERO IMAGE
================================ */

.hero-image{
    position:relative;

    height:650px;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:5;
}

.hero-image img{
    width:100%;

    max-width:760px;

    height:auto;

    object-fit:contain;

    display:block;

    filter:
        drop-shadow(0 18px 22px rgba(0,0,0,0.18));

    transform:translateY(30px);
}


/* ================================
   PACK BADGE
================================ */

.pack-badge{
    position:absolute;

    right:20px;
    bottom:55px;

    width:165px;
    height:165px;

    border-radius:50%;

    background:rgba(255,255,255,0.96);

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.10);

    z-index:8;
}

.pack-badge strong{
    font-size:28px;

    color:#07563d;

    letter-spacing:1px;
}

.pack-badge span{
    margin-top:8px;

    font-size:9px;

    letter-spacing:4px;

    color:#07563d;
}


/* ================================
   DECORATIVE CIRCLE
================================ */

.decor-circle{
    position:absolute;

    width:600px;
    height:600px;

    right:-230px;
    top:170px;

    border-radius:50%;

    border:24px solid rgba(125,170,70,0.12);

    z-index:2;
}

.decor-circle::after{
    content:"";

    position:absolute;

    inset:55px;

    border-radius:50%;

    border:12px solid rgba(125,170,70,0.08);
}


/* ================================
   BOTTOM SECTION
================================ */

.info-strip{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;

    height:8px;

    background:
        linear-gradient(
            90deg,
            #07563d,
            #83d900,
            #eda900
        );

    z-index:20;
}


/* ================================
   RESPONSIVE
================================ */

@media(max-width:1200px){

    .header-inner{
        padding:0 35px;
    }

    .logo,
    .logo img{
        width:300px;
    }

    .nav{
        gap:25px;
    }

    .nav a{
        font-size:13px;
    }

    .quote-btn{
        padding:15px 25px;
    }

    .hero-content{
        grid-template-columns:48% 52%;

        padding-left:35px;
        padding-right:35px;
    }

    .hero-text{
        padding-left:10px;
    }

    .hero-text h1{
        font-size:58px;
    }

    .hero-image{
        height:580px;
    }

    .hero-image img{
        max-width:650px;
    }
}


/* ================================
   TABLET
================================ */

@media(max-width:900px){

    .header{
        height:auto;

        padding-top:20px;
    }

    .header-inner{
        flex-direction:column;

        gap:20px;
    }

    .logo,
    .logo img{
        width:300px;
    }

    .nav{
        flex-wrap:wrap;

        justify-content:center;

        gap:18px;
    }

    .quote-btn{
        display:none;
    }

    .hero-content{
        grid-template-columns:1fr;

        padding-top:210px;

        text-align:center;
    }

    .hero-text{
        padding-left:0;

        margin-top:0;

        order:1;
    }

    .hero-text h1{
        font-size:52px;
    }

    .hero-description{
        margin-left:auto;
        margin-right:auto;
    }

    .hero-buttons{
        justify-content:center;
    }

    .hero-image{
        order:2;

        height:500px;
    }

    .hero-image img{
        max-width:620px;
    }

    .pack-badge{
        right:5%;

        bottom:25px;

        width:130px;
        height:130px;
    }

    .pack-badge strong{
        font-size:23px;
    }
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    .hero::before{
        background-position:center;
    }

    .header-inner{
        padding:0 15px;
    }

    .logo,
    .logo img{
        width:250px;
    }

    .nav{
        gap:14px;
    }

    .nav a{
        font-size:11px;
    }

    .hero-content{
        padding:
            190px
            18px
            30px;
    }

    .hero-text h1{
        font-size:39px;

        letter-spacing:-1px;
    }

    .hero-description{
        font-size:14px;

        line-height:1.6;
    }

    .hero-buttons{
        flex-direction:column;

        gap:12px;
    }

    .btn-primary,
    .btn-secondary{
        width:220px;
    }

    .hero-image{
        height:350px;
    }

    .hero-image img{
        max-width:430px;

        transform:translateY(0);
    }

    .pack-badge{
        width:105px;
        height:105px;

        right:2%;
        bottom:10px;
    }

    .pack-badge strong{
        font-size:19px;
    }

    .pack-badge span{
        font-size:6px;
        letter-spacing:2px;
    }
}

</style>
</head>


<body>


<!-- ================================
     HOME HERO
================================ -->

<section class="hero" id="home">


    <!-- DECORATION -->

    <div class="decor-circle"></div>


    <!-- ================================
         HEADER
    ================================= -->

    <header class="header">

        <div class="header-inner">


            <!-- LOGO -->

            <a href="#home" class="logo">

                <img
                    src="logo.png"
                    alt="Vishnu Packs Logo"
                >

            </a>


            <!-- NAVIGATION -->

            <nav class="nav">

                <a
                    href="#home"
                    class="active"
                >
                    HOME
                </a>

                <a href="#about">
                    ABOUT
                </a>

                <a href="#products">
                    PRODUCTS
                </a>

                <a href="#industries">
                    INDUSTRIES
                </a>

                <a href="#quality">
                    QUALITY
                </a>

                <a href="#contact">
                    CONTACT
                </a>

                <a
                    href="#contact"
                    class="quote-btn"
                >
                    GET A QUOTE
                </a>

            </nav>

        </div>

    </header>



    <!-- ================================
         HERO CONTENT
    ================================= -->

    <div class="hero-content">


        <!-- TEXT -->

        <div class="hero-text">


            <h1>

                SMART<br>

                PACKAGING.<br>

                <span>
                    STRONGER
                </span>

                <span>
                    POSSIBILITIES.
                </span>

            </h1>


            <p class="hero-description">

                Reliable packaging solutions designed to pack,
                protect and deliver with confidence.
                We care in every Pack.

            </p>


            <div class="hero-buttons">


                <a
                    href="#products"
                    class="btn-primary"
                >
                    EXPLORE PRODUCTS
                </a>


                <a
                    href="#contact"
                    class="btn-secondary"
                >
                    CONTACT US
                </a>


            </div>


        </div>



        <!-- PRODUCT IMAGE -->

        <div class="hero-image">


            <img
                src="hero-product.png"
                alt="Vishnu Packs Packaging"
            >


            <!-- PACK BADGE -->

            <div class="pack-badge">

                <strong>
                    PACK
                </strong>

                <span>
                    PROTECT · DELIVER
                </span>

            </div>


        </div>


    </div>



    <!-- BOTTOM LINE -->

    <div class="info-strip"></div>


</section>



<!-- ================================
     SIMPLE ANCHOR SECTIONS
================================ -->

<section id="about"></section>

<section id="products"></section>

<section id="industries"></section>

<section id="quality"></section>

<section id="contact"></section>


</body>
</html>
